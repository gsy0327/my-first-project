<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大邑县住宿业税收监控</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb;
    --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7;
    --border: rgba(11,11,11,.10);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    --band: rgba(195,194,183,.35);
    --good: #0ca30c;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19;
      --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835;
      --border: rgba(255,255,255,.10);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
      --band: rgba(56,56,53,.5);
      --good: #0ca30c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19;
    --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835;
    --border: rgba(255,255,255,.10);
    --s1: #3987e5; --s2: #205957; --s3: #199e70; --s4: #c98500;
    --band: rgba(56,56,53,.5);
    --good: #0ca30c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 64px; }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 16px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; letter-spacing: .2px; }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
  .sub { color: var(--ink2); font-size: 13px; margin: 0; }
  .theme-btn {
    flex: none; font: inherit; font-size: 12px; color: var(--ink2);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  .theme-btn:hover { color: var(--ink); }
  .btn {
    font: inherit; font-size: 12px; color: var(--ink2);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 12px; cursor: pointer;
  }
  .btn:hover { color: var(--ink); }
  .btn.active { color: var(--ink); border-color: var(--axis); background: var(--band); }
  .replay-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 2px 0 4px; }
  .replay-clock { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .readout { font-size: 12px; color: var(--ink2); margin: 4px 0 8px; min-height: 18px; }
  .readout b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .progress { height: 2px; background: var(--grid); border-radius: 1px; margin-top: 8px; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--s1); border-radius: 1px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-bottom: 16px;
  }
  /* 筛选行 */
  .filters { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; padding: 14px 20px; }
  .filters .f { display: flex; flex-direction: column; gap: 3px; }
  .filters label { font-size: 12px; color: var(--muted); }
  .filters select, .filters input {
    font: inherit; font-size: 13px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 8px; min-width: 104px;
  }
  .filters .kw { min-width: 170px; }
  .export-btn {
    margin-left: auto; font: inherit; font-size: 12px; color: var(--ink2);
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 12px; cursor: pointer;
  }
  .export-btn:hover { color: var(--ink); }
  /* 面包屑 */
  .crumbs { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin: 0 0 14px; flex-wrap: wrap; }
  .crumbs a { color: var(--ink2); text-decoration: none; cursor: pointer; }
  .crumbs a:hover { color: var(--ink); text-decoration: underline; }
  .crumbs .sep { color: var(--muted); }
  /* 指标 */
  .hero-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .hero-row .card { margin-bottom: 0; }
  .hero { flex: 1 1 250px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; }
  .tile { flex: 1 1 150px; display: flex; flex-direction: column; gap: 2px; }
  .lbl { color: var(--ink2); font-size: 12px; }
  .hero .val { font-size: 40px; font-weight: 600; line-height: 1.1; letter-spacing: -.5px; }
  .tile .val { font-size: 22px; font-weight: 600; line-height: 1.2; }
  .dlt, .tile .sub2 { color: var(--ink2); font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 10px; }
  .chip {
    font-size: 12px; color: var(--ink2); border: 1px solid var(--border);
    border-radius: 999px; padding: 2px 10px;
  }
  .chip.exempt { color: var(--good); border-color: var(--good); }
  .chart-sub { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
  .legend { display: flex; gap: 18px; font-size: 12px; color: var(--ink2); margin: 0 0 10px; flex-wrap: wrap; }
  .legend .key { display: inline-flex; align-items: center; gap: 6px; }
  .legend .swatch { display: inline-block; width: 14px; height: 2px; border-radius: 1px; }
  .legend .sq { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
  .chart-box { position: relative; outline: none; border-radius: 8px; }
  .chart-box:focus-visible { outline: 2px solid var(--ink2); outline-offset: 4px; }
  .tip {
    position: absolute; pointer-events: none; z-index: 5; display: none;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 12px; min-width: 148px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .tip .hd { color: var(--ink2); margin-bottom: 4px; }
  .tip .row { display: flex; align-items: center; gap: 8px; padding: 1px 0; }
  .tip .lk { width: 14px; height: 2px; border-radius: 1px; flex: none; }
  .tip .sq2 { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .tip .nm { color: var(--ink2); flex: 1; }
  .tip .vl { font-weight: 600; font-variant-numeric: tabular-nums; }
  .table-scroll { max-height: 480px; overflow: auto; border: 1px solid var(--border); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  thead th {
    color: var(--muted); font-weight: 500;
    position: sticky; top: 0; background: var(--surface); z-index: 1;
  }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--band); }
  tbody tr:last-child td { border-bottom: none; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 28px 0; }
  .notes { color: var(--muted); font-size: 12px; margin: 0; padding-left: 18px; }
  .notes li { margin: 3px 0; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>大邑县住宿业税收监控</h1>
      <p class="sub" id="subtitle"></p>
    </div>
    <button class="theme-btn" id="themeBtn">深色模式</button>
  </header>

  <div class="card filters">
    <div class="f"><label for="fTown">乡镇/街道</label><select id="fTown"></select></div>
    <div class="f"><label for="fType">商家类型</label><select id="fType"></select></div>
    <div class="f"><label for="fPlat">平台</label><select id="fPlat"></select></div>
    <div class="f"><label for="fTax">纳税人类型</label><select id="fTax"></select></div>
    <div class="f"><label for="fKw">搜索（名称/乡镇）</label><input id="fKw" class="kw" type="search" placeholder="如：溪云栖、花水湾"></div>
    <button class="export-btn" id="exportBtn">导出当前视图 CSV</button>
  </div>

  <nav class="crumbs" id="crumbs"></nav>
  <div id="view"></div>

  <ul class="notes" id="notes"></ul>

</div>

<script>
'use strict';
const DATA = /*__DATA__*/;
const { meta, county, towns, merchants } = DATA;

// ---------- 格式化 ----------
const pct = v => (v * 100).toFixed(1) + '%';
const money = v => '¥' + Math.round(v).toLocaleString('zh-CN');
const wan = v => v >= 10000 ? '¥' + (v / 10000).toLocaleString('zh-CN', { maximumFractionDigits: 1 }) + '万' : '¥' + Math.round(v);
const pp = v => (v >= 0 ? '+' : '') + (v * 100).toFixed(1);
const TAX_SERIES = [
  { key: 'vat', name: '增值税', color: 'var(--s1)' },
  { key: 'surcharge', name: '附加税费', color: 'var(--s3)' },
  { key: 'income', name: '所得税', color: 'var(--s2)' },
];
const OTA_KEYS = ['ctrip', 'meituan', 'feizhu', 'qunar', 'tongcheng', 'tujia'];
const OTA_NAMES = { ctrip: '携程', meituan: '美团', feizhu: '飞猪', qunar: '去哪儿', tongcheng: '同程', tujia: '途家' };
const TYPE_KEYS = ['温泉民宿', '客栈', '农家乐', '酒店'];
const PLATFORM_COLORS = { ctrip: 'var(--s1)', meituan: 'var(--s2)', feizhu: 'var(--s3)' };

// ---------- 状态: 视图 + 筛选 ----------
function parseHash() {
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/');
  if (parts[0] === 'town' && parts[1]) return { level: 'town', townId: parts[1] };
  if (parts[0] === 'merchant' && parts[1]) return { level: 'merchant', merchantId: parts[1] };
  return { level: 'county' };
}
let view = parseHash();
const filters = { town: 'all', type: 'all', platform: 'all', taxType: 'all', kw: '' };
function nav(v) {
  location.hash = v.level === 'town' ? `/town/${v.townId}` : v.level === 'merchant' ? `/merchant/${v.merchantId}` : '/';
}
function filtered() {
  return merchants.filter(m =>
    (filters.town === 'all' || m.townId === filters.town) &&
    (filters.type === 'all' || m.type === filters.type) &&
    (filters.taxType === 'all' || m.taxType === filters.taxType) &&
    (filters.platform === 'all' || m.platforms.includes(filters.platform)) &&
    (!filters.kw || m.name.includes(filters.kw) || m.townName.includes(filters.kw)));
}
function aggOf(list) {
  const a = { rev: 0, netRevenue: 0, vat: 0, surcharge: 0, income: 0, total: 0, n: 0, rooms: 0, occSum: 0, exempt: 0 };
  for (const m of list) {
    a.rev += m.monthlyRev; a.netRevenue += m.tax.netRevenue; a.vat += m.tax.vat; a.surcharge += m.tax.surcharge; a.income += m.tax.income; a.total += m.tax.total;
    a.n++; a.rooms += m.rooms; a.occSum += m.avgOcc; if (m.tax.exempt) a.exempt++;
  }
  a.avgOcc = a.n ? a.occSum / a.n : 0;
  a.rate = a.rev > 0 ? a.total / a.rev : 0;
  return a;
}

// ---------- 主题 ----------
const btn = document.getElementById('themeBtn');
const mq = matchMedia('(prefers-color-scheme: dark)');
function currentTheme() { return document.documentElement.dataset.theme || (mq.matches ? 'dark' : 'light'); }
function syncBtn() { btn.textContent = currentTheme() === 'dark' ? '浅色模式' : '深色模式'; }
btn.addEventListener('click', () => {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('viz-theme', next); } catch (e) {}
  syncBtn();
});
try { const saved = localStorage.getItem('viz-theme'); if (saved) document.documentElement.dataset.theme = saved; } catch (e) {}
syncBtn();

// ---------- DOM 工具 ----------
const SVGNS = 'http://www.w3.org/2000/svg';
function el(name, attrs) {
  const node = document.createElementNS(SVGNS, name);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  return node;
}
function svgText(x, y, s, fill, anchor, size) {
  const t = el('text', { x, y, 'text-anchor': anchor || 'middle', 'font-size': size || 11 });
  t.style.fill = fill;
  t.textContent = s;
  return t;
}
function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
function makeTip(box) {
  const tip = document.createElement('div');
  tip.className = 'tip';
  box.appendChild(tip);
  return tip;
}
function showTip(box, tip, header, rows, px, py) {
  tip.textContent = '';
  const hd = document.createElement('div');
  hd.className = 'hd';
  hd.textContent = header;
  tip.appendChild(hd);
  for (const r of rows) {
    const row = document.createElement('div');
    row.className = 'row';
    const lk = document.createElement('span');
    lk.className = r.square ? 'sq2' : 'lk';
    lk.style.background = r.color;
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = r.name;
    const vl = document.createElement('span');
    vl.className = 'vl';
    vl.textContent = r.value;
    row.append(lk, nm, vl);
    tip.appendChild(row);
  }
  tip.style.display = 'block';
  const tw = tip.offsetWidth;
  let left = px + 14;
  if (left + tw > box.clientWidth - 4) left = px - tw - 14;
  tip.style.left = Math.max(0, left) + 'px';
  tip.style.top = Math.min(py + 12, box.clientHeight - tip.offsetHeight - 8) + 'px';
}
function hideTip(tip) { tip.style.display = 'none'; }

// ---------- 图例 ----------
function buildLegend(elx, series, square) {
  for (const s of series) {
    const key = document.createElement('span');
    key.className = 'key';
    const swatch = document.createElement('span');
    swatch.className = square ? 'sq' : 'swatch';
    swatch.style.background = s.color;
    const name = document.createElement('span');
    name.textContent = s.name;
    key.append(swatch, name);
    elx.appendChild(key);
  }
}

// ---------- 折线图 (入住率/价格) ----------
function buildChart(box, opts) {
  const W = 900, H = 240, mL = 46, mR = 64, mT = 14, mB = 28;
  const plotW = W - mL - mR, plotH = H - mT - mB;
  const n = opts.series[0].values.length;
  const x = i => mL + (n <= 1 ? plotW / 2 : i / (n - 1) * plotW);
  const [y0, y1] = opts.range;
  const y = v => mT + (1 - (v - y0) / (y1 - y0)) * plotH;

  const svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H, width: '100%' });
  svg.style.display = 'block';

  for (const t of opts.yTicks) {
    const g = el('line', { x1: mL, x2: W - mR, y1: y(t), y2: y(t) });
    g.style.stroke = 'var(--grid)';
    g.setAttribute('stroke-width', 1);
    svg.appendChild(g);
    svg.appendChild(svgText(mL - 8, y(t) + 4, opts.yFmt(t), 'var(--muted)', 'end'));
  }
  const base = el('line', { x1: mL, x2: W - mR, y1: y(y0), y2: y(y0) });
  base.style.stroke = 'var(--axis)';
  base.setAttribute('stroke-width', 1);
  svg.appendChild(base);
  const step = Math.max(1, Math.ceil(n / 7));
  for (let i = 0; i < n; i += step) svg.appendChild(svgText(x(i), H - 8, opts.labels[i], 'var(--muted)'));
  if ((n - 1) % step > 2) svg.appendChild(svgText(x(n - 1), H - 8, opts.labels[n - 1], 'var(--muted)'));

  const half = n > 1 ? plotW / (n - 1) / 2 : plotW / 2;
  for (const b of opts.bands || []) {
    const rect = el('rect', { x: x(b.from) - half, y: mT, width: x(b.to) - x(b.from) + half * 2, height: plotH });
    rect.style.fill = 'var(--band)';
    svg.appendChild(rect);
    svg.appendChild(svgText(x(b.from) + 6, mT + 13, b.name, 'var(--muted)', 'start'));
  }

  const placed = [];
  for (const s of opts.series) {
    const pts = s.values.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
    const pl = el('polyline', { points: pts });
    pl.style.stroke = s.color;
    pl.setAttribute('stroke-width', 2);
    pl.setAttribute('fill', 'none');
    pl.setAttribute('stroke-linejoin', 'round');
    pl.setAttribute('stroke-linecap', 'round');
    svg.appendChild(pl);

    const last = s.values[n - 1];
    const dot = el('circle', { cx: x(n - 1), cy: y(last), r: 4 });
    dot.style.fill = s.color;
    dot.style.stroke = 'var(--surface)';
    dot.setAttribute('stroke-width', 2);
    svg.appendChild(dot);

    let ly = y(last) + 4;
    while (placed.some(p => Math.abs(ly - p) < 13)) ly += 15;
    placed.push(ly);
    svg.appendChild(svgText(x(n - 1) + 10, ly, opts.vFmt(s, last), 'var(--ink2)', 'start'));
  }

  const cross = el('line', { y1: mT, y2: mT + plotH });
  cross.style.stroke = 'var(--axis)';
  cross.setAttribute('stroke-width', 1);
  cross.style.display = 'none';
  svg.appendChild(cross);
  const snapDots = opts.series.map(s => {
    const d = el('circle', { r: 4 });
    d.style.fill = s.color;
    d.style.stroke = 'var(--surface)';
    d.setAttribute('stroke-width', 2);
    d.style.display = 'none';
    svg.appendChild(d);
    return d;
  });
  const tip = makeTip(box);
  let idx = -1;

  function show(i) {
    idx = clamp(i, 0, n - 1);
    cross.style.display = 'block';
    cross.setAttribute('x1', x(idx));
    cross.setAttribute('x2', x(idx));
    opts.series.forEach((s, k) => {
      snapDots[k].style.display = 'block';
      snapDots[k].setAttribute('cx', x(idx));
      snapDots[k].setAttribute('cy', y(s.values[idx]));
    });
    showTip(box, tip,
      opts.dateHeader ? opts.dateHeader(idx) : '',
      opts.series.map(s => ({ color: s.color, name: s.name, value: opts.vFmt(s, s.values[idx]) })),
      x(idx) * svg.getBoundingClientRect().width / W, 4);
  }
  function hide() {
    cross.style.display = 'none';
    snapDots.forEach(d => { d.style.display = 'none'; });
    hideTip(tip);
    idx = -1;
  }
  svg.addEventListener('pointermove', e => {
    const r = svg.getBoundingClientRect();
    const px = (e.clientX - r.left) * W / r.width;
    show(Math.round((px - mL) / plotW * (n - 1)));
  });
  svg.addEventListener('pointerleave', hide);
  box.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { show((idx === -1 ? 0 : idx) + (e.key === 'ArrowLeft' ? -1 : 1)); e.preventDefault(); }
    else if (e.key === 'Escape') hide();
  });
  box.appendChild(svg);
}

// ---------- 堆叠柱状图 (对比 + 下钻) ----------
function stackedBars(box, opts) {
  const W = 900;
  const mL = opts.horizontal ? 180 : 46;
  const mR = 64, mT = 26, mB = opts.horizontal ? 10 : 52;
  const rowH = 26;
  const H = opts.horizontal ? mT + opts.items.length * rowH + mB : 260;
  const plotW = W - mL - mR, plotH = H - mT - mB;
  const maxV = Math.max(1, ...opts.items.map(it => it.values.reduce((a, b) => a + b, 0)));
  const nice = (v) => {
    const mag = Math.pow(10, Math.floor(Math.log10(v)));
    const steps = [1, 2, 5, 10];
    const s = steps.find(st => v / (mag * st) <= 5) || 10;
    return mag * s;
  };
  const tick = nice(maxV / 5);
  const yMax = Math.ceil(maxV / tick) * tick;

  const svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H, width: '100%' });
  svg.style.display = 'block';
  const tip = makeTip(box);

  if (opts.horizontal) {
    // 纵向网格 + 顶部刻度
    for (let v = 0; v <= yMax; v += tick) {
      const px = mL + (v / yMax) * plotW;
      const g = el('line', { x1: px, x2: px, y1: mT - 8, y2: mT + opts.items.length * rowH });
      g.style.stroke = 'var(--grid)';
      g.setAttribute('stroke-width', 1);
      svg.appendChild(g);
      svg.appendChild(svgText(px, mT - 14, opts.yFmt(v), 'var(--muted)'));
    }
    opts.items.forEach((it, i) => {
      const cy = mT + i * rowH + rowH / 2;
      svg.appendChild(svgText(mL - 10, cy + 4, it.label, 'var(--ink2)', 'end'));
      let acc = 0;
      const g = el('g', { tabindex: 0 });
      g.setAttribute('aria-label', it.label + '，点击查看详情');
      g.style.cursor = 'pointer';
      const total = it.values.reduce((a, b) => a + b, 0);
      opts.series.forEach((s, k) => {
        const w = (it.values[k] / yMax) * plotW;
        const rect = el('rect', { x: mL + (acc / yMax) * plotW + 1, y: cy - 9, width: Math.max(0, w - 2), height: 18, rx: k === opts.series.length - 1 ? 4 : 0 });
        rect.style.fill = s.color;
        g.appendChild(rect);
        rect.addEventListener('pointerenter', e => {
          const r = svg.getBoundingClientRect();
          showTip(box, tip, it.label,
            [{ square: true, color: s.color, name: s.name, value: opts.vFmt(it.values[k]) },
             { square: true, color: 'var(--muted)', name: '合计', value: opts.vFmt(total) }],
            (mL + (acc / yMax) * plotW + w / 2) * r.width / W, cy - 6);
        });
        rect.addEventListener('pointerleave', () => hideTip(tip));
        acc += it.values[k];
      });
      g.addEventListener('click', () => opts.onClick(it.id));
      g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { opts.onClick(it.id); e.preventDefault(); } });
      svg.appendChild(g);
    });
  } else {
    // 纵向柱: 底部刻度 + 标签旋转
    const slot = plotW / opts.items.length;
    const bw = Math.min(24, slot * 0.55);
    for (let v = 0; v <= yMax; v += tick) {
      const py = mT + (1 - v / yMax) * plotH;
      const g = el('line', { x1: mL, x2: W - mR, y1: py, y2: py });
      g.style.stroke = 'var(--grid)';
      g.setAttribute('stroke-width', 1);
      svg.appendChild(g);
      svg.appendChild(svgText(mL - 8, py + 4, opts.yFmt(v), 'var(--muted)', 'end'));
    }
    opts.items.forEach((it, i) => {
      const cx = mL + slot * i + slot / 2;
      let acc = 0;
      const g = el('g', { tabindex: 0 });
      g.setAttribute('aria-label', it.label + '，点击查看详情');
      g.style.cursor = 'pointer';
      const total = it.values.reduce((a, b) => a + b, 0);
      opts.series.forEach((s, k) => {
        const h = (it.values[k] / yMax) * plotH;
        const rect = el('rect', { x: cx - bw / 2, y: mT + plotH - (acc + it.values[k]) / yMax * plotH, width: bw, height: Math.max(0, h - 1), rx: k === 0 ? 4 : 0 });
        rect.style.fill = s.color;
        g.appendChild(rect);
        rect.addEventListener('pointerenter', e => {
          const r = svg.getBoundingClientRect();
          showTip(box, tip, it.label,
            [{ square: true, color: s.color, name: s.name, value: opts.vFmt(it.values[k]) },
             { square: true, color: 'var(--muted)', name: '合计', value: opts.vFmt(total) }],
            cx * r.width / W, mT + plotH - (acc + it.values[k]) / yMax * plotH);
        });
        rect.addEventListener('pointerleave', () => hideTip(tip));
        acc += it.values[k];
      });
      const lbl = svgText(cx + 4, H - 30, it.label, 'var(--muted)', 'start', 11);
      lbl.setAttribute('transform', `rotate(-32 ${cx + 4} ${H - 30})`);
      svg.appendChild(lbl);
      g.addEventListener('click', () => opts.onClick(it.id));
      g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { opts.onClick(it.id); e.preventDefault(); } });
      svg.appendChild(g);
    });
  }
  box.appendChild(svg);
}

// ---------- 县域动态回放 (模拟实时抓取) ----------
const SNAPSHOT_LABELS = ['00:00', '08:00', '14:00', '20:00'];
const replay = { timer: null, playing: false, step: 0, speed: 1, metric: 'occ', totalSteps: 0 };
let replayClockTimer = null;

function taxEngineClient(taxType, rev) {
  const t = meta.taxCfg;
  let vat = 0, exempt = false;
  if (taxType === '一般纳税人') {
    vat = (rev / (1 + t.generalVatRate)) * t.generalVatRate * (1 - t.deductRate);
  } else if (rev <= t.exemptThreshold) {
    exempt = true;
  } else {
    vat = (rev / (1 + t.smallVatRate)) * t.smallVatRate;
  }
  const surcharge = vat * t.surchargeRate * (taxType !== '一般纳税人' && t.halfSurcharge ? 0.5 : 1);
  let income;
  if (taxType === '个体户') income = rev * t.incomeRate * (t.halfIncome ? 0.5 : 1);
  else if (taxType === '小规模企业') income = rev * t.profitRate * t.smallCoRate;
  else income = rev * t.profitRate * t.generalCoRate;
  return { exempt, total: vat + surcharge + income };
}

function replaySeries(metric, list) {
  const first = list[0].days;
  const out = [];
  const cum = new Map();
  for (let i = 0; i < first.length; i++) {
    let sold = 0, rooms = 0, rev = 0, tax = 0;
    for (const m of list) {
      const d = m.days[i];
      sold += d.sold; rooms += m.rooms; rev += d.rev;
      if (metric === 'tax') {
        const c = (cum.get(m.id) || 0) + d.rev;
        cum.set(m.id, c);
        tax += taxEngineClient(m.taxType, c).total;
      }
    }
    out.push({ date: first[i].date, label: first[i].label, typeLabel: first[i].typeLabel, sold, rooms, rev, tax, occ: rooms ? (sold / rooms) * 100 : 0 });
  }
  return out;
}

function drawReplayChart(box, days, solidDay, metric) {
  box.textContent = '';
  const W = 900, H = 200, mL = 46, mR = 64, mT = 14, mB = 28;
  const plotW = W - mL - mR, plotH = H - mT - mB;
  const n = days.length;
  const vals = metric === 'occ' ? days.map(d => d.occ) : days.map(d => d.tax);
  let yMax, yFmt;
  if (metric === 'occ') { yMax = 100; yFmt = v => v + '%'; }
  else {
    const maxV = Math.max(1, ...vals);
    const mag = Math.pow(10, Math.floor(Math.log10(maxV)));
    const st = [1, 2, 5, 10].find(s => maxV / (mag * s) <= 5) || 10;
    yMax = Math.ceil(maxV / (mag * st)) * (mag * st);
    yFmt = wan;
  }
  const x = i => mL + (n <= 1 ? plotW / 2 : i / (n - 1) * plotW);
  const y = v => mT + (1 - v / yMax) * plotH;
  const svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H, width: '100%' });
  svg.style.display = 'block';
  for (let v = 0; v <= yMax + 1e-9; v += yMax / 4) {
    const g = el('line', { x1: mL, x2: W - mR, y1: y(v), y2: y(v) });
    g.style.stroke = 'var(--grid)';
    g.setAttribute('stroke-width', 1);
    svg.appendChild(g);
    svg.appendChild(svgText(mL - 8, y(v) + 4, yFmt(v), 'var(--muted)', 'end'));
  }
  const step = Math.max(1, Math.ceil(n / 7));
  for (let i = 0; i < n; i += step) svg.appendChild(svgText(x(i), H - 8, days[i].label, 'var(--muted)'));
  if ((n - 1) % step > 2) svg.appendChild(svgText(x(n - 1), H - 8, days[n - 1].label, 'var(--muted)'));
  if (solidDay >= 1) {
    const pts = vals.slice(0, solidDay).map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
    const pl = el('polyline', { points: pts });
    pl.style.stroke = 'var(--s1)';
    pl.setAttribute('stroke-width', 2);
    pl.setAttribute('fill', 'none');
    pl.setAttribute('stroke-linejoin', 'round');
    pl.setAttribute('stroke-linecap', 'round');
    svg.appendChild(pl);
    const li = solidDay - 1;
    const dot = el('circle', { cx: x(li), cy: y(vals[li]), r: 4 });
    dot.style.fill = 'var(--s1)';
    dot.style.stroke = 'var(--surface)';
    dot.setAttribute('stroke-width', 2);
    svg.appendChild(dot);
    const cross = el('line', { x1: x(li), x2: x(li), y1: mT, y2: mT + plotH });
    cross.style.stroke = 'var(--axis)';
    cross.setAttribute('stroke-width', 1);
    svg.appendChild(cross);
  }
  box.appendChild(svg);
}

function buildReplayCard(list) {
  if (!list.length) return null;
  const daysIn = list[0].days.length;
  replay.totalSteps = daysIn * 4;
  if (replay.timer) { clearInterval(replay.timer); replay.timer = null; }
  replay.playing = false;
  replay.step = Math.min(replay.step, replay.totalSteps - 1);

  const card = document.createElement('div');
  card.className = 'card';
  card.style.marginTop = '16px';
  const h2 = document.createElement('h2');
  h2.textContent = '动态回放 · 实时抓取进度（模拟）';
  const sub = document.createElement('p');
  sub.className = 'chart-sub';
  sub.textContent = '回放本月 00:00/08:00/14:00/20:00 四个时点的抓取过程，20:00 快照后当日数据入库；累计税收按逐日累计营业额实时重算（含免征阈值翻转）。';
  const head = document.createElement('div');
  head.className = 'replay-head';
  const btnPlay = document.createElement('button'); btnPlay.className = 'btn'; btnPlay.textContent = '播放';
  const btnReset = document.createElement('button'); btnReset.className = 'btn'; btnReset.textContent = '重置';
  const btnToday = document.createElement('button'); btnToday.className = 'btn'; btnToday.textContent = '跳至今日';
  const speedSel = document.createElement('select'); speedSel.className = 'btn';
  for (const s of [1, 2, 4]) {
    const o = document.createElement('option'); o.value = s; o.textContent = s + '×'; speedSel.appendChild(o);
  }
  const btnOcc = document.createElement('button'); btnOcc.className = 'btn active'; btnOcc.textContent = '入住率';
  const btnTax = document.createElement('button'); btnTax.className = 'btn'; btnTax.textContent = '累计税收';
  const clock = document.createElement('span');
  clock.className = 'replay-clock';
  head.append(btnPlay, btnReset, btnToday, speedSel, btnOcc, btnTax, clock);
  card.append(h2, sub, head);

  const readout = document.createElement('div');
  readout.className = 'readout';
  readout.setAttribute('aria-live', 'polite');
  const chart = document.createElement('div');
  chart.className = 'chart-box';
  chart.tabIndex = 0;
  chart.setAttribute('aria-label', '动态回放曲线，左右方向键逐快照移动，空格播放/暂停');
  const progress = document.createElement('div');
  progress.className = 'progress';
  const bar = document.createElement('i');
  progress.appendChild(bar);
  card.append(readout, chart, progress);

  const bjFmt = new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Shanghai', hour12: false, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const clockTick = () => { clock.textContent = '当前北京时间 ' + bjFmt.format(new Date()).replace(/\//g, '-'); };
  clockTick();
  if (replayClockTimer) clearInterval(replayClockTimer);
  replayClockTimer = setInterval(clockTick, 1000);

  const tg = k => bjFmt.formatToParts(new Date()).find(p => p.type === k)?.value || '';
  const inMonth = `${tg('year')}-${tg('month')}` === list[0].days[0].date.slice(0, 7);
  btnToday.style.display = inMonth ? '' : 'none';

  const redraw = () => {
    const dayIdx = Math.floor(replay.step / 4);
    const snap = replay.step % 4;
    const captured = snap === 3 ? dayIdx : dayIdx - 1;
    const s = replaySeries(replay.metric, list);
    drawReplayChart(chart, s, captured + 1, replay.metric);
    bar.style.width = (replay.step / (replay.totalSteps - 1) * 100).toFixed(1) + '%';
    readout.textContent = '';
    const d = list[0].days[dayIdx];
    const b = document.createElement('b');
    b.textContent = d.date + ' ' + SNAPSHOT_LABELS[snap] + (snap === 3 ? '（当日数据入库）' : ' 抓取中');
    readout.append(b, ' ');
    readout.append(document.createTextNode(`快照 ${replay.step + 1}/${replay.totalSteps} · `));
    if (captured >= 0) {
      const c = s[captured];
      readout.append(document.createTextNode(`已售房晚 ${c.sold.toLocaleString('zh-CN')}/${c.rooms.toLocaleString('zh-CN')} · 当日营业额 ${wan(c.rev)} · `));
      const b2 = document.createElement('b');
      b2.textContent = replay.metric === 'occ' ? ('入住率 ' + c.occ.toFixed(1) + '%') : ('累计测算税收 ' + wan(c.tax));
      readout.append(b2);
    } else {
      readout.append(document.createTextNode('尚无已入库数据'));
    }
  };

  const setPlaying = (p) => {
    replay.playing = p;
    btnPlay.textContent = p ? '暂停' : '播放';
    if (replay.timer) { clearInterval(replay.timer); replay.timer = null; }
    if (p) {
      if (replay.step >= replay.totalSteps - 1) { replay.step = 0; redraw(); }
      replay.timer = setInterval(() => {
        if (replay.step >= replay.totalSteps - 1) { setPlaying(false); return; }
        replay.step++;
        redraw();
      }, Math.round(280 / replay.speed));
    }
  };
  btnPlay.addEventListener('click', () => setPlaying(!replay.playing));
  btnReset.addEventListener('click', () => { replay.step = 0; setPlaying(false); redraw(); });
  btnToday.addEventListener('click', () => {
    replay.step = Math.min((Number(tg('day')) - 1) * 4 + 3, replay.totalSteps - 1);
    setPlaying(false);
    redraw();
  });
  speedSel.addEventListener('change', () => {
    replay.speed = Number(speedSel.value);
    if (replay.playing) setPlaying(true);
  });
  const setMetric = (metric) => {
    replay.metric = metric;
    btnOcc.classList.toggle('active', metric === 'occ');
    btnTax.classList.toggle('active', metric === 'tax');
    redraw();
  };
  btnOcc.addEventListener('click', () => setMetric('occ'));
  btnTax.addEventListener('click', () => setMetric('tax'));
  chart.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') { replay.step = Math.min(replay.step + 1, replay.totalSteps - 1); setPlaying(false); redraw(); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { replay.step = Math.max(replay.step - 1, 0); setPlaying(false); redraw(); e.preventDefault(); }
    else if (e.key === ' ') { setPlaying(!replay.playing); e.preventDefault(); }
  });

  redraw();
  return card;
}

function renderTable(rows, cols, onClick) {
  const scroll = document.createElement('div');
  scroll.className = 'table-scroll';
  const tbl = document.createElement('table');
  const thead = document.createElement('thead');
  const tr = document.createElement('tr');
  for (const c of cols) {
    const th = document.createElement('th');
    th.textContent = c;
    tr.appendChild(th);
  }
  thead.appendChild(tr);
  tbl.appendChild(thead);
  const tbody = document.createElement('tbody');
  for (const r of rows) {
    const row = document.createElement('tr');
    row.tabIndex = 0;
    row.setAttribute('aria-label', r.label + '，点击查看详情');
    r.cells.forEach((v, i) => {
      const td = document.createElement('td');
      td.textContent = v;
      td.style.textAlign = i === 0 ? 'left' : 'right';
      row.appendChild(td);
    });
    row.addEventListener('click', () => onClick(r.id));
    row.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { onClick(r.id); e.preventDefault(); } });
    tbody.appendChild(row);
  }
  tbl.appendChild(tbody);
  scroll.appendChild(tbl);
  return scroll;
}

function merchantRows(list) {
  return list.slice().sort((a, b) => b.tax.total - a.tax.total).map(m => ({
    id: m.id, label: m.name,

      money(m.monthlyRev), money(m.tax.netRevenue), money(m.tax.vat), money(m.tax.surcharge), money(m.tax.income),
      money(m.tax.total), (m.tax.rate * 100).toFixed(2) + '%', m.tax.exempt ? '免征' : ''],
  }));
}

function renderTown() {
  const townId = view.townId;
  const t = towns.find(t => t.townId === townId);
  const townMeta = meta.townsAll.find(t => t.id === townId);
  const box = document.getElementById('view');
  box.textContent = '';
  if (!townMeta) { box.appendChild(emptyState('未知乡镇。')); return; }

  if (!t) {
    const card = document.createElement('div');
    card.className = 'card';
    card.appendChild(emptyState(`${townMeta.name}（${townMeta.tag}）在试点范围内暂无数据 — 运行 node simulate_county.js --towns all 生成全县数据。`));
    box.appendChild(card);
    return;
  }
  const list = filtered().filter(m => m.townId === townId);
  const a = aggOf(list);
  if (!list.length) {
    const card = document.createElement('div');
    card.className = 'card';
    card.appendChild(emptyState('该乡镇在当前筛选条件下无匹配商家，请调整筛选条件。'));
    box.appendChild(card);
    return;
  }

  const row1 = document.createElement('div');
  row1.className = 'hero-row';
  row1.style.marginTop = '16px';
  const hero = document.createElement('div'); hero.className = 'card hero';
  heroCard(hero, `${t.townName} · 测算税收`, money(a.total),
    `营业收入(含税) ${money(a.rev)} · 不含税 ${money(a.netRevenue)} · 税负率 ${(a.rate * 100).toFixed(2)}% · 免税 ${a.exempt}/${a.n} 家`);
  row1.appendChild(hero);
  const t1 = document.createElement('div'); t1.className = 'card tile';
  tileCard(t1, '商家', a.n + ' 家', `房间 ${a.rooms.toLocaleString('zh-CN')} 间`);
  row1.appendChild(t1);
  const t2 = document.createElement('div'); t2.className = 'card tile';
  tileCard(t2, '月均入住率', pct(a.avgOcc), '20:00 剩余房量反推');
  row1.appendChild(t2);
  const t3 = document.createElement('div'); t3.className = 'card tile';
  tileCard(t3, '增值税', money(a.vat), '附加 ' + money(a.surcharge) + ' / 所得税 ' + money(a.income));
  row1.appendChild(t3);
  box.appendChild(row1);

  const card1 = document.createElement('div');
  card1.className = 'card';
  card1.style.marginTop = '16px';
  const h1 = document.createElement('h2');
  h1.textContent = '商家税收对比';
  const sub1 = document.createElement('p');
  sub1.className = 'chart-sub';
  sub1.textContent = '点击横条进入商家详情；三段依次为增值税 / 附加税费 / 所得税';
  const legend1 = document.createElement('div');
  legend1.className = 'legend';
  buildLegend(legend1, TAX_SERIES, true);
  const chart1 = document.createElement('div');
  chart1.className = 'chart-box';
  chart1.tabIndex = 0;
  card1.append(h1, sub1, legend1, chart1);
  box.appendChild(card1);
  stackedBars(chart1, {
    horizontal: true,
    items: list.slice().sort((x, y) => y.tax.total - x.tax.total).map(m => ({ id: m.id, label: m.name, values: [m.tax.vat, m.tax.surcharge, m.tax.income] })),
    series: TAX_SERIES,
    yFmt: wan,
    vFmt: money,
    onClick: id => nav({ level: 'merchant', merchantId: id }),
  });

  const card2 = document.createElement('div');
  card2.className = 'card';
  const h2 = document.createElement('h2');
  h2.textContent = '商家明细（点击行查看详情）';
  card2.appendChild(h2);
  if (list.length) card2.appendChild(renderTable(merchantRows(list), MERCHANT_COLS, id => nav({ level: 'merchant', merchantId: id })));
  else card2.appendChild(emptyState('该乡镇在当前筛选条件下无匹配商家。'));
  box.appendChild(card2);
}

function renderMerchant() {
  const m = merchants.find(m => m.id === view.merchantId);
  const box = document.getElementById('view');
  box.textContent = '';
  if (!m) { box.appendChild(emptyState('商家不存在（可能被筛选排除或名册变更）。')); return; }

  const head = document.createElement('div');
  head.className = 'card';
  head.style.marginTop = '16px';
  const h1 = document.createElement('h2');
  h1.textContent = m.name;
  const chips = document.createElement('div');
  chips.className = 'chips';
  chips.append(
    chip(m.type), chip(m.townName), chip(m.taxType),
    chip(`${m.rooms} 间 · 基准价 ${money(m.basePrice)}`),
    ...m.platforms.map(k => chip(OTA_NAMES[k] || k)),
  );
  if (m.tax.exempt) chips.append(chip('✓ 增值税免征（月销售额≤10万）', 'exempt'));
  head.append(h1, chips);

  const row1 = document.createElement('div');
  row1.className = 'hero-row';
  const t1 = document.createElement('div'); t1.className = 'card tile';
  tileCard(t1, '营业收入（含税）', money(m.monthlyRev), '不含税 ' + money(m.tax.netRevenue) + ' · 入住率 ' + pct(m.avgOcc));
  row1.appendChild(t1);
  const t2 = document.createElement('div'); t2.className = 'card tile';
  tileCard(t2, '测算税收', money(m.tax.total), '税负率 ' + (m.tax.rate * 100).toFixed(2) + '%');
  row1.appendChild(t2);
  const t3 = document.createElement('div'); t3.className = 'card tile';
  tileCard(t3, '增值税', money(m.tax.vat), m.tax.exempt ? '月销售额≤10万免征' : '小规模 1% / 一般 6%');
  row1.appendChild(t3);
  const t4 = document.createElement('div'); t4.className = 'card tile';
  tileCard(t4, '附加税费', money(m.tax.surcharge), '小规模减半');
  row1.appendChild(t4);
  const t5 = document.createElement('div'); t5.className = 'card tile';
  tileCard(t5, '所得税', money(m.tax.income), m.taxType === '个体户' ? '核定征收 1%×减半' : '企业 5%-25%');
  row1.appendChild(t5);
  head.appendChild(row1);
  box.appendChild(head);

  // 税收构成
  const card0 = document.createElement('div');
  card0.className = 'card';
  const h0 = document.createElement('h2');
  h0.textContent = '税收构成';
  const c0 = document.createElement('div');
  c0.className = 'chart-box';
  card0.append(h0, c0);
  compBar(c0, { vat: m.tax.vat, surcharge: m.tax.surcharge, income: m.tax.income, rate: m.tax.rate });
  box.appendChild(card0);

  // 入住率曲线
  const card1 = document.createElement('div');
  card1.className = 'card';
  const h2 = document.createElement('h2');
  h2.textContent = '入住率曲线（真实 vs 20:00 反推）';
  const sub2 = document.createElement('p');
  sub2.className = 'chart-sub';
  sub2.textContent = '每天四个时点抓取剩余房量，取 20:00 反推当日入住率；底纹为节假日';
  const legend2 = document.createElement('div');
  legend2.className = 'legend';
  buildLegend(legend2, [
    { name: '真实入住率', color: 'var(--s1)' },
    { name: '反推入住率（20:00）', color: 'var(--s2)' },
  ]);
  const chart2 = document.createElement('div');
  chart2.className = 'chart-box';
  chart2.tabIndex = 0;
  chart2.setAttribute('aria-label', '入住率曲线图，左右方向键移动光标查看每日数值');
  card1.append(h2, sub2, legend2, chart2);
  box.appendChild(card1);
  buildChart(chart2, {
    series: [
      { name: '真实入住率', color: 'var(--s1)', values: m.days.map(d => d.trueOcc * 100) },
      { name: '反推入住率（20:00）', color: 'var(--s2)', values: m.days.map(d => d.inferredOcc * 100) },
    ],
    labels: m.days.map(d => d.label),
    range: [0, 100],
    yTicks: [0, 25, 50, 75, 100],
    yFmt: v => v + '%',
    vFmt: (s, v) => v.toFixed(1) + '%',
    dateHeader: i => m.days[i].date + ' · ' + m.days[i].typeLabel,
    bands: holidayBands(m.days),
  });

  // 价格曲线: 携程/美团/飞猪 + 其他平台折合
  const card2 = document.createElement('div');
  card2.className = 'card';
  const h3 = document.createElement('h2');
  h3.textContent = '日均价曲线（分平台）';
  const sub3 = document.createElement('p');
  sub3.className = 'chart-sub';
  sub3.textContent = '展示携程/美团/飞猪三条线，其余平台折合为"其他平台"；每日价格为四个抓取时点均值';
  const legend3 = document.createElement('div');
  legend3.className = 'legend';
  const chart3 = document.createElement('div');
  chart3.className = 'chart-box';
  chart3.tabIndex = 0;
  chart3.setAttribute('aria-label', '价格曲线图，左右方向键移动光标查看每日数值');
  card2.append(h3, sub3, legend3, chart3);
  box.appendChild(card2);

  const priceSeries = [];
  const keys = ['ctrip', 'meituan', 'feizhu'];
  for (const k of keys) {
    const vals = m.days.map(d => {
      const q = d.platforms.find(q => q.key === k);
      return q ? q.avgPrice : null;
    });
    if (vals.some(v => v !== null)) {
      priceSeries.push({ name: OTA_NAMES[k], color: PLATFORM_COLORS[k], values: vals.map((v, i) => v !== null ? v : (m.days[i].avgPrice)) });
    }
  }
  const otherVals = m.days.map((d, i) => {
    const others = d.platforms.filter(q => !keys.includes(q.key));
    return others.length ? Math.round(others.reduce((a, q) => a + q.avgPrice, 0) / others.length) : null;
  });
  if (otherVals.some(v => v !== null)) {
    priceSeries.push({ name: '其他平台', color: 'var(--ink2)', values: otherVals.map((v, i) => v !== null ? v : m.days[i].avgPrice) });
  }
  buildLegend(legend3, priceSeries);
  if (!priceSeries.length) {
    chart3.appendChild(emptyState('该商家未入驻可展示的平台。'));
  } else {
    function priceTicks(series) {
      const all = series.flatMap(s => s.values);
      const lo = Math.min(...all), hi = Math.max(...all);
      const candidates = [25, 50, 100, 200, 250, 500];
      const step = candidates.find(st => (hi - lo) / st <= 6) || 1000;
      let ticks = [];
      for (let v = Math.floor(lo / step) * step; v <= Math.ceil(hi / step) * step; v += step) ticks.push(v);
      if (ticks.length === 1) ticks = [lo - step, lo, lo + step];
      return { ticks, range: [ticks[0], ticks[ticks.length - 1]] };
    }
    const pt = priceTicks(priceSeries);
    buildChart(chart3, {
      series: priceSeries,
      labels: m.days.map(d => d.label),
      range: pt.range,
      yTicks: pt.ticks,
      yFmt: v => money(v),
      vFmt: (s, v) => money(Math.round(v)),
      dateHeader: i => m.days[i].date + ' · ' + m.days[i].typeLabel,
      bands: holidayBands(m.days),
    });
  }

  // 快照表
  const card3 = document.createElement('div');
  card3.className = 'card';
  const h4 = document.createElement('h2');
  h4.textContent = '每日抓取明细';
  const sub4 = document.createElement('p');
  sub4.className = 'chart-sub';
  sub4.textContent = '售出房晚 = 当日实际售出间数；剩余/均价 = 各平台 20:00 展示剩余间数 / 当日该平台四时点均价(元)；入住率单位 %';
  card3.append(h4, sub4);
  const platKeys = m.platforms;
  const cols = ['日期', '类型', '售出房晚', '真实入住率', '反推入住率', '日均价', '日营业额'];
  for (const k of platKeys) cols.push((OTA_NAMES[k] || k) + ' 剩余/均价');
  const rows = m.days.map(d => {
    const cells = [d.date, d.typeLabel, d.sold, (d.trueOcc * 100).toFixed(1) + '%', (d.inferredOcc * 100).toFixed(1) + '%', money(d.avgPrice), money(d.rev)];
    for (const k of platKeys) {
      const q = d.platforms.find(q => q.key === k);
      cells.push(q ? `${q.rem20} / ${money(q.avgPrice)}` : '');
    }
    return { id: d.date, label: d.date, cells };
  });
  card3.appendChild(renderTable(rows, cols, () => {}));
  box.appendChild(card3);
}

function holidayBands(days) {
  const runs = [];
  days.forEach((d, i) => {
    if (d.type === 'holiday') {
      const last = runs[runs.length - 1];
      if (last && last.to === i - 1) last.to = i;
      else runs.push({ from: i, to: i, name: d.typeLabel });
    }
  });
  return runs;
}

// ---------- 面包屑 ----------
function renderCrumbs() {
  const box = document.getElementById('crumbs');
  box.textContent = '';
  const county = document.createElement('a');
  county.textContent = '县域总览';
  county.addEventListener('click', () => nav({ level: 'county' }));
  box.appendChild(county);
  if (view.level === 'town' || view.level === 'merchant') {
    const m = view.level === 'merchant' ? merchants.find(x => x.id === view.merchantId) : null;
    const townId = view.level === 'town' ? view.townId : (m ? m.townId : null);
    const tm = meta.townsAll.find(t => t.id === townId);
    const sep = document.createElement('span'); sep.className = 'sep'; sep.textContent = '/';
    const a = document.createElement('a');
    a.textContent = tm ? tm.name : townId;
    a.addEventListener('click', () => nav({ level: 'town', townId }));
    box.append(sep, a);
    if (view.level === 'merchant' && m) {
      const sep2 = document.createElement('span'); sep2.className = 'sep'; sep2.textContent = '/';
      const b = document.createElement('span');
      b.textContent = m.name;
      box.append(sep2, b);
    }
  }
}

// ---------- 筛选器 ----------
function fillSelect(sel, pairs) {
  sel.textContent = '';
  for (const [v, label] of pairs) {
    const o = document.createElement('option');
    o.value = v;
    o.textContent = label;
    sel.appendChild(o);
  }
}
const fTown = document.getElementById('fTown');
const fType = document.getElementById('fType');
const fPlat = document.getElementById('fPlat');
const fTax = document.getElementById('fTax');
const fKw = document.getElementById('fKw');
fillSelect(fTown, [['all', '全部乡镇'], ...meta.townsAll.map(t => [t.id, t.name])]);
fillSelect(fType, [['all', '全部类型'], ...TYPE_KEYS.map(k => [k, k])]);
fillSelect(fPlat, [['all', '全部平台'], ...OTA_KEYS.map(k => [k, OTA_NAMES[k]])]);
fillSelect(fTax, [['all', '全部纳税人类型'], ['个体户', '个体户'], ['小规模企业', '小规模企业'], ['一般纳税人', '一般纳税人']]);
fTown.addEventListener('change', () => { filters.town = fTown.value; render(); });
fType.addEventListener('change', () => { filters.type = fType.value; render(); });
fPlat.addEventListener('change', () => { filters.platform = fPlat.value; render(); });
fTax.addEventListener('change', () => { filters.taxType = fTax.value; render(); });
fKw.addEventListener('input', () => { filters.kw = fKw.value.trim(); render(); });

// ---------- CSV 导出 ----------
function exportCSV() {
  const list = filtered();
  const a = aggOf(list);
  const scope = view.level === 'county' ? '县域' : view.level === 'town' ? (meta.townsAll.find(t => t.id === view.townId) || {}).name : (merchants.find(m => m.id === view.merchantId) || {}).name;
  const lines = [
    ['范围', scope, '月份', meta.monthLabel, '商家数', a.n, '月营业额', Math.round(a.rev), '税收合计', Math.round(a.total), '税负率%', (a.rate * 100).toFixed(2)],
    [],
    ['商家名称', '类型', '乡镇', '纳税人类型', '房间数', '月均入住率%', '月营业额', '增值税', '附加税费', '所得税', '税收合计', '税负率%', '增值税免征'],
    ...merchantRows(list).map(r => r.cells),
    [],
    ['口径说明', meta.policyRef],
  ];
  const csv = '﻿' + lines.map(r => r.join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a2 = document.createElement('a');
  a2.href = url;
  a2.download = `大邑住宿业税收_${meta.key}_${scope}.csv`;
  a2.click();
  URL.revokeObjectURL(url);
}
document.getElementById('exportBtn').addEventListener('click', exportCSV);

// ---------- 说明 ----------
function buildNotes() {
  const NOTES = [
    meta.policyRef,
    '计税营业额 = 售出房晚 × 成交价（OTA 佣金为费用不扣减）；税收为测算值，非征管数。',
    '反推入住率 =（总房量 − 20:00 各平台展示剩余均值）÷ 总房量；20:00 后仍有约 5% 临时到店，故反推略低于真实。',
    '本页为模拟数据（方法验证）。真实监控数据可通过名册导入：import/商家名册_模板.csv 复制为 商家名册.csv 后运行 node simulate_county.js --roster import/商家名册.csv。',
    '乡镇/街道范围为试点口径：--towns huashuiwan 仅生成花水湾镇；--towns all 生成全县 11 个乡镇/街道。',
    '所有抓取时点为北京时间（Asia/Shanghai）；页面时钟与动态回放实时读取当前系统北京时间。',
  ];
  const notes = document.getElementById('notes');
  notes.textContent = '';
  for (const t of NOTES) {
    const li = document.createElement('li');
    li.textContent = t;
    notes.appendChild(li);
  }
}

// ---------- 入口 ----------
document.getElementById('subtitle').textContent =
  `${meta.monthLabel} · ${meta.scopeLabel} · ${merchants.length} 家商家 · 6 平台监控（携程/美团/飞猪/去哪儿/同程/途家）· 模拟数据 · 生成于 ${meta.generatedAt}`;

function render() {
  renderCrumbs();
  if (view.level === 'county') renderCounty();
  else if (view.level === 'town') renderTown();
  else renderMerchant();
}
window.addEventListener('hashchange', () => { view = parseHash(); render(); });
buildNotes();
render();
</script>
